name: Temporary Blender COD Map Build
on:
  push:
    branches: [tmp/blender-cod-map-20260903]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Blender Python module and headless graphics runtime
        run: |
          python -m pip install --disable-pip-version-check bpy==5.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libx11-6 libxkbcommon0 libsm6 libxext6 libxrender1
      - name: Decode and patch generator
        run: |
          cat .tmp-cod-map/chunk_00.txt .tmp-cod-map/chunk_01.txt .tmp-cod-map/chunk_02.txt | base64 -di | gzip -d > build_cod_map.py
          sed -i "/scene=bpy.context.scene/a scene.world=bpy.data.worlds.new('World')" build_cod_map.py
          python -m py_compile build_cod_map.py
          wc -l -c build_cod_map.py
      - name: Generate Blender scene and validation renders
        env:
          OUT_BLEND: ${{ github.workspace }}/coastal_intercept.blend
          PREVIEW_DIR: ${{ github.workspace }}/previews
        run: python build_cod_map.py
      - name: Inspect artifact
        run: |
          ls -lh coastal_intercept.blend previews/*.png
          python - <<'PY'
          import bpy
          bpy.ops.wm.open_mainfile(filepath='coastal_intercept.blend')
          s=bpy.context.scene
          print('objects', len(bpy.data.objects), 'meshes', sum(o.type=='MESH' for o in bpy.data.objects), 'materials', len(bpy.data.materials))
          print('map', s.get('map_name'), s.get('dimensions_m'), s.get('lanes'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coastal-intercept-map
          path: |
            coastal_intercept.blend
            previews/*.png
            build_cod_map.py
          compression-level: 6
          retention-days: 1
